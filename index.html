<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Puzzle - Kids Puzzle Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(#bde0fe,#ffd6e8);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;color:#4a3b69}
h1{margin:6px 0;font-size:clamp(24px,6vw,36px)}
.ad{width:100%;max-width:728px;min-height:60px;margin:8px 0;border:2px dashed #b8a9d9;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#8a7bb0;background:#ffffff80}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
button.pill{font:inherit;font-weight:bold;font-size:16px;border:none;border-radius:999px;padding:10px 18px;background:#fff;color:#4a3b69;box-shadow:0 3px 0 #c9b8ee;cursor:pointer}
button.pill.on{background:#7c5cff;color:#fff;box-shadow:0 3px 0 #5a3fd1}
#board{display:grid;width:min(92vw,420px);aspect-ratio:1;gap:3px;background:#fff;padding:3px;border-radius:16px;box-shadow:0 6px 0 #c9b8ee;margin:10px 0;position:relative}
.t{border:none;padding:0;border-radius:8px;cursor:pointer;background-color:#eee;transition:transform .12s}
.t:active{transform:scale(.95)}
.t.sel{outline:4px solid #ff9f1c;transform:scale(.94)}
.t.empty{visibility:hidden}
#board.won{animation:pop .6s}
@keyframes pop{50%{transform:scale(1.04)}}
#info{font-size:18px;font-weight:bold;min-height:28px}
#win{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;z-index:5}
#win div{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;max-width:90vw}
#win .big{font-size:60px}
.prev{width:90px;height:90px;border-radius:12px;border:3px solid #fff;background-size:cover;box-shadow:0 3px 0 #c9b8ee}
</style>
</head>
<body>
<h1>🧩 Fun Puzzle</h1>

<!-- AD SLOT TOP: paste your AdSense code here (keep child-directed settings ON) -->
<div class="ad">Ad space</div>

<div class="bar" id="modes">
  <button class="pill on" data-m="jig">🧩 Jigsaw</button>
  <button class="pill" data-m="slide">🔀 Sliding</button>
</div>
<div class="bar" id="sizes">
  <button class="pill" data-n="2">Easy 2×2</button>
  <button class="pill on" data-n="3">Medium 3×3</button>
  <button class="pill" data-n="4">Hard 4×4</button>
</div>
<div class="bar" id="pics"></div>
<div id="info"></div>
<div id="board"></div>
<div class="bar">
  <button class="pill" id="shuf">🔄 New Game</button>
  <button class="pill" id="peek">👀 Peek</button>
</div>

<!-- AD SLOT BOTTOM: keep ads away from the board so kids do not click by mistake -->
<div class="ad" style="margin-top:30px">Ad space</div>

<div id="win"><div><div class="big">🎉⭐🎉</div><h2>Well done! Puzzle complete!</h2><p id="wm"></p><button class="pill on" id="again">Play Again</button></div></div>

<script>
const PICS=[
 {a:'#ffe29f',b:'#ffa99f',e:'🦁',d:['☀️','🌼','🌸']},
 {a:'#a8edea',b:'#7bb8f5',e:'🐠',d:['🫧','🐚','🌊']},
 {a:'#d4fc79',b:'#96e6a1',e:'🐘',d:['🌳','🦋','🍎']},
 {a:'#fbc2eb',b:'#a6c1ee',e:'🦄',d:['🌈','⭐','☁️']}
];
const svg=p=>{const s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${p.a}'/><stop offset='1' stop-color='${p.b}'/></linearGradient></defs><rect width='300' height='300' fill='url(#g)'/><text x='150' y='215' font-size='190' text-anchor='middle'>${p.e}</text><text x='45' y='70' font-size='48' text-anchor='middle'>${p.d[0]}</text><text x='255' y='75' font-size='48' text-anchor='middle'>${p.d[1]}</text><text x='150' y='285' font-size='44' text-anchor='middle'>${p.d[2]}</text></svg>`;return 'url("data:image/svg+xml,'+encodeURIComponent(s)+'")'};
const IMG=PICS.map(svg);
let mode='jig',n=3,pi=0,tiles=[],moves=0,sel=-1,done=false,peeking=false;
const $=id=>document.getElementById(id);
const board=$('board');

// sound
let ac;function beep(f,d=.1){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}

function init(){
  const N=n*n;tiles=[...Array(N).keys()];moves=0;sel=-1;done=false;
  if(mode==='slide'){
    let e=N-1;
    for(let i=0;i<n*n*20;i++){
      const r=Math.floor(e/n),c=e%n,nb=[];
      if(r>0)nb.push(e-n);if(r<n-1)nb.push(e+n);if(c>0)nb.push(e-1);if(c<n-1)nb.push(e+1);
      const m=nb[Math.floor(Math.random()*nb.length)];
      [tiles[e],tiles[m]]=[tiles[m],tiles[e]];e=m;
    }
  }else{
    do{for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tiles[i],tiles[j]]=[tiles[j],tiles[i]]}}
    while(tiles.every((v,i)=>v===i));
  }
  render();
}
function render(){
  const N=n*n;
  board.style.gridTemplate=`repeat(${n},1fr)/repeat(${n},1fr)`;
  board.innerHTML='';board.classList.remove('won');
  tiles.forEach((v,i)=>{
    const b=document.createElement('button');b.className='t';
    const r=Math.floor(v/n),c=v%n;
    b.style.backgroundImage=IMG[pi];
    b.style.backgroundSize=`${n*100}% ${n*100}%`;
    b.style.backgroundPosition=`${c/(n-1)*100}% ${r/(n-1)*100}%`;
    if(mode==='slide'&&v===N-1&&!done)b.classList.add('empty');
    if(i===sel)b.classList.add('sel');
    b.onclick=()=>tap(i);
    board.appendChild(b);
  });
  $('info').textContent=done?'🌟 Hooray!':(mode==='jig'?'Tap two pieces to swap them 👆':'Slide a tile into the empty space 👆')+'  •  Moves: '+moves;
}
function tap(i){
  if(done)return;
  const N=n*n;
  if(mode==='jig'){
    if(sel<0){sel=i;beep(500);}
    else if(sel===i){sel=-1}
    else{[tiles[sel],tiles[i]]=[tiles[i],tiles[sel]];sel=-1;moves++;beep(660)}
  }else{
    const e=tiles.indexOf(N-1);
    const r1=Math.floor(i/n),c1=i%n,r2=Math.floor(e/n),c2=e%n;
    if(Math.abs(r1-r2)+Math.abs(c1-c2)!==1)return;
    [tiles[e],tiles[i]]=[tiles[i],tiles[e]];moves++;beep(440);
  }
  if(tiles.every((v,k)=>v===k)){done=true;win()}
  render();
}
function win(){
  beep(523,.15);setTimeout(()=>beep(659,.15),150);setTimeout(()=>beep(784,.3),300);
  const s=moves<=n*n*2?'⭐⭐⭐':moves<=n*n*5?'⭐⭐':'⭐';
  $('wm').textContent='Solved in '+moves+' moves! '+s;
  setTimeout(()=>{board.classList.add('won');$('win').style.display='flex'},400);
}
$('again').onclick=()=>{$('win').style.display='none';init()};
$('shuf').onclick=init;
$('peek').onclick=()=>{
  if(peeking)return;peeking=true;const old=tiles.slice(),was=done;
  tiles=[...Array(n*n).keys()];done=true;render();
  setTimeout(()=>{tiles=old;done=was;peeking=false;render()},1500);
};
$('modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;[...$('modes').children].forEach(b=>b.classList.toggle('on',b.dataset.m===m));init()};
$('sizes').onclick=e=>{const v=e.target.dataset.n;if(!v)return;n=+v;[...$('sizes').children].forEach(b=>b.classList.toggle('on',b.dataset.n===v));init()};
IMG.forEach((im,i)=>{const b=document.createElement('button');b.className='prev';b.style.backgroundImage=im;b.onclick=()=>{pi=i;init()};$('pics').appendChild(b)});
init();
</script>
</body>
</html>
